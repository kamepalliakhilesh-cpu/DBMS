version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: disaster_relief_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-disaster_relief_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql

  web:
    build: .
    container_name: disaster_relief_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-root123}
      - DB_NAME=${DB_NAME:-disaster_relief_db}
      - SECRET_KEY=${SECRET_KEY:-disaster-relief-secret-key-2026}
      - FLASK_ENV=production
      - FLASK_DEBUG=False
    depends_on:
      - db

volumes:
  mysql_data:
